name: Local Windows installer (MSVC)
on:
  workflow_dispatch:
    inputs:
      version:
        description: Installer version (artifact only, no GitHub release)
        required: true
        default: 10.0.7-alpha.1
      runtime_run_id:
        description: Optional previous run ID with windows-runtime-x86_64; repackage without compiling
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      version:
        description: Installer version supplied by the manual release workflow
        required: true
        type: string
      runtime_run_id:
        description: Optional preserved runtime from an earlier run
        required: false
        default: ''
        type: string
concurrency:
  group: windows-msvc-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  windows:
    name: Compile and preserve Windows runtime
    if: github.ref == 'refs/heads/main' && inputs.runtime_run_id == ''
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      CA_WINDOWS_TOOLS: D:/ca-tools
      RELEASE_VERSION: ${{ inputs.version || '10.0.7-alpha.1' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - name: Identify dependency profile
        id: profile
        run: |
          . ./tools/circuitalive/release/windows-dependencies-data.ps1
          "value=$(Get-WindowsDependencyProfile (Get-Location).Path)" | Add-Content $env:GITHUB_OUTPUT
      - name: Restore compiler-tracked vcpkg cache
        uses: actions/cache/restore@v5
        with:
          path: D:/ca-tools/binary-cache
          key: windows-msvc-v143-${{ steps.profile.outputs.value }}-${{ github.run_id }}-${{ github.run_attempt }}-installer
          # vcpkg validates each archive's compiler/port ABI, including on this fallback.
          # Packaging-only script changes must not hide otherwise compatible packages.
          restore-keys: |
            windows-msvc-v143-${{ steps.profile.outputs.value }}-
            windows-msvc-v143-
      - name: Check toolchain initialization against Developer PowerShell overrides
        run: |
          ./qa/tests/cli/test_windows_toolchain.ps1
          python qa/tests/cli/test_windows_installer.py
          python qa/tests/cli/test_component_libraries.py
      - name: Check real x64 installer before the expensive application build
        run: ./tools/circuitalive/release/prepare-inno.ps1
      - name: Test installer generation and extraction
        run: python qa/tests/cli/test_windows_installer.py WindowsInstallerTests.test_real_installer_extracts_libraries_and_excludes_git_metadata
      - name: Prepare Visual Studio, vcpkg and SWIG
        run: ./tools/circuitalive/release/build-windows.ps1 -Phase setup
      - name: Record resources before dependency preparation
        run: ./tools/circuitalive/release/audit-windows.ps1 -Phase inventory -OutputDirectory build/windows-dependencies
      - name: Prepare dependencies explicitly before CMake
        run: ./tools/circuitalive/release/build-windows.ps1 -Phase dependencies
      - name: Preserve dependency cache and diagnostics before applications
        if: always()
        uses: ./.github/actions/windows-dependency-checkpoint
        with:
          name: installer
          cache-key: windows-msvc-v143-${{ steps.profile.outputs.value }}-${{ github.run_id }}-${{ github.run_attempt }}-installer
      - name: Configure applications with dependency installation disabled
        run: ./tools/circuitalive/release/build-windows.ps1 -Phase configure -Version $env:RELEASE_VERSION
      - name: Validate affected sources and simulator, then build all applications
        run: ./tools/circuitalive/release/build-windows.ps1 -Phase build
      - name: Stage application and dependencies without building an installer
        run: ./tools/circuitalive/release/build-windows.ps1 -Phase stage -Version $env:RELEASE_VERSION
      - name: Preserve verified runtime before packaging
        uses: actions/upload-artifact@v7
        with:
          name: windows-runtime-x86_64
          path: stage/windows-msvc/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 6
          retention-days: 14
      - name: Keep validation logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-msvc-diagnostics
          path: |
            build/windows-msvc/CMakeCache.txt
            build/windows-msvc/CMakeFiles/CMakeConfigureLog.yaml
            build/windows-msvc/Testing/Temporary/*.log
          if-no-files-found: ignore

  package:
    name: Package and verify Windows installer
    needs: windows
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.windows.result == 'success' || inputs.runtime_run_id != '')
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      CA_WINDOWS_TOOLS: D:/ca-tools
      RELEASE_VERSION: ${{ inputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - name: Restore preserved application without a C++ build
        uses: actions/download-artifact@v8
        with:
          name: windows-runtime-x86_64
          path: stage/windows-msvc
          github-token: ${{ github.token }}
          run-id: ${{ inputs.runtime_run_id || github.run_id }}
      - name: Verify runtime integrity and packaging regression tests
        run: |
          python qa/tests/cli/test_windows_installer.py
          python qa/tests/cli/test_component_libraries.py
          python tools/circuitalive/release/package-windows.py stage/windows-msvc --version $env:RELEASE_VERSION --verify-only
      - name: Prepare pinned native x64 Inno Setup
        run: ./tools/circuitalive/release/prepare-inno.ps1
      - name: Exercise real installer and extraction before acquiring large libraries
        run: python qa/tests/cli/test_windows_installer.py WindowsInstallerTests.test_real_installer_extracts_libraries_and_excludes_git_metadata
      - name: Prepare component libraries
        run: ./tools/circuitalive/release/prepare-windows-libraries.ps1
      - name: Package and test a clean installed runtime
        run: python tools/circuitalive/release/package-windows.py stage/windows-msvc --version $env:RELEASE_VERSION
      - name: Downloadable Windows EXE installer
        uses: actions/upload-artifact@v7
        with:
          path: dist/CircuitAliveEDA-${{ env.RELEASE_VERSION }}-windows-x86_64-setup.exe
          archive: false
          if-no-files-found: error
      - name: Preserve Windows installer checksum
        uses: actions/upload-artifact@v7
        with:
          name: CircuitAliveEDA-${{ env.RELEASE_VERSION }}-windows-SHA256
          path: dist/*-windows-x86_64-setup.exe.sha256
          if-no-files-found: error
      - name: Preserve installer diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-diagnostics
          path: |
            dist/installer.iss
            dist/installer-smoke.log
            dist/windows-package-report.json
          retention-days: 14
          if-no-files-found: warn
