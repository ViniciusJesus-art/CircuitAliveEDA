name: Local Windows installer (MSVC)
on:
  workflow_dispatch:
    inputs:
      version:
        description: Installer version (artifact only, no GitHub release)
        required: true
        default: 10.0.7-alpha.1
concurrency:
  group: windows-msvc-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      CA_WINDOWS_TOOLS: D:/ca-tools
      RELEASE_VERSION: ${{ inputs.version || '10.0.7-alpha.1' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Identify dependency profile
        id: profile
        run: |
          . ./tools/circuitalive/release/windows-dependencies-data.ps1
          "value=$(Get-WindowsDependencyProfile (Get-Location).Path)" | Add-Content $env:GITHUB_OUTPUT
      - name: Restore compiler-tracked vcpkg cache
        uses: actions/cache/restore@v4
        with:
          path: D:/ca-tools/binary-cache
          key: windows-msvc-v143-${{ steps.profile.outputs.value }}-${{ github.run_id }}-${{ github.run_attempt }}-installer
          restore-keys: windows-msvc-v143-${{ steps.profile.outputs.value }}-
      - name: Check toolchain initialization against Developer PowerShell overrides
        run: ./qa/tests/cli/test_windows_toolchain.ps1
      - name: Prepare Visual Studio, vcpkg and SWIG
        run: ./tools/circuitalive/release/build-windows.ps1 -Phase setup
      - name: Record resources before dependency preparation
        run: ./tools/circuitalive/release/audit-windows.ps1 -Phase inventory -OutputDirectory build/windows-dependencies
      - name: Prepare dependencies explicitly before CMake
        run: ./tools/circuitalive/release/build-windows.ps1 -Phase dependencies
      - name: Preserve dependency cache and diagnostics before applications
        if: always()
        uses: ./.github/actions/windows-dependency-checkpoint
        with:
          name: installer
          cache-key: windows-msvc-v143-${{ steps.profile.outputs.value }}-${{ github.run_id }}-${{ github.run_attempt }}-installer
      - name: Configure applications with dependency installation disabled
        run: ./tools/circuitalive/release/build-windows.ps1 -Phase configure -Version $env:RELEASE_VERSION
      - name: Validate affected sources and simulator, then build all applications
        run: ./tools/circuitalive/release/build-windows.ps1 -Phase build
      - name: Prepare component libraries and NSIS
        run: |
          choco install nsis --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          ./tools/circuitalive/release/prepare-windows-libraries.ps1
      - name: Package and verify installed runtime
        run: ./tools/circuitalive/release/build-windows.ps1 -Phase package -Version $env:RELEASE_VERSION
      - name: Keep installer available for local download
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            dist/*-windows-x86_64-setup.exe
            dist/*-windows-x86_64-setup.exe.sha256
          if-no-files-found: error
          compression-level: 0
      - name: Keep validation logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-msvc-diagnostics
          path: |
            build/windows-msvc/CMakeCache.txt
            build/windows-msvc/CMakeFiles/CMakeConfigureLog.yaml
            build/windows-msvc/Testing/Temporary/*.log
          if-no-files-found: ignore
