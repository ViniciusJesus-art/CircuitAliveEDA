name: Ubuntu DEB package
run-name: Ubuntu DEB ${{ inputs.version }}

# Commits, pushes and tags do not start a release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Public GitHub release name (independent of the application version)
        required: true
        default: 10.0.7-alpha.4.1
        type: string
      package_version:
        description: Application/installer/About version — KiCad-CircuitAlive (e.g. 10.0.7-alpha.4.1 or 10.0.7-1.2.3)
        required: true
        default: 10.0.7-alpha.4.1
        type: string
      publish_release:
        description: Publish only the Ubuntu DEB (leave unchecked to assemble a cross-platform release locally)
        type: boolean
        default: false

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    name: Validate version and release destination
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      release_label: ${{ steps.release.outputs.release_label }}
      formats: ${{ steps.release.outputs.formats }}
    steps:
      - uses: actions/checkout@v7
      - name: Check release publication guard
        run: |
          python3 qa/tests/cli/test_release_artifacts.py
          python3 qa/tests/cli/test_release_versions.py
          python3 qa/tests/cli/test_component_libraries.py
      - uses: actions/github-script@v8
        id: release
        env:
          RELEASE_LABEL: ${{ inputs.version }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        with:
          script: |
            if (context.ref !== 'refs/heads/main') {
              throw new Error('Run this release workflow from main.');
            }
            const label = process.env.RELEASE_LABEL.trim();
            if (!label || label.length > 100 || /[\x00-\x1f\x7f]/.test(label)) {
              throw new Error('Enter a nonempty release name of at most 100 printable characters.');
            }
            const slug = label.normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
              .replace(/[^A-Za-z0-9._-]+/g, '-').replace(/^[._-]+|[._-]+$/g, '')
              .replace(/\.{2,}/g, '.').slice(0, 80).replace(/[._-]+$/g, '');
            if (!slug) throw new Error('Release name needs a letter or number for its filename.');
            const tag = /^v[0-9]/.test(slug) ? slug : `v${slug}`;
            // Public label and technical version are independent. Never infer an
            // application version from the label or the CI run number.
            const version = process.env.PACKAGE_VERSION.trim();
            const parsed = /^([0-9]+\.[0-9]+\.[0-9]+)-(alpha\.)?([0-9]+(?:\.[0-9]+){0,3})$/.exec(version);
            if (!parsed || parsed[3].split('.').some(part => Number(part) > 65535)) {
              throw new Error('Enter KiCad-CircuitAlive version, e.g. 10.0.7-alpha.4.1 or 10.0.7-1.2.3 (1–4 CircuitAlive numbers, each 0–65535).');
            }
            const formats = ['deb'];
            if (process.env.PUBLISH_RELEASE === 'true') for (const lookup of [
              () => github.rest.git.getRef({...context.repo, ref: `tags/${tag}`}),
              () => github.rest.repos.getReleaseByTag({...context.repo, tag})
            ]) {
              try { await lookup(); }
              catch (error) {
                if (error.status === 404) continue;
                throw error;
              }
              throw new Error(`Tag or release ${tag} already exists. Choose an unused version.`);
            }
            core.setOutput('version', version);
            core.setOutput('release_label', label);
            core.setOutput('tag', tag);
            core.setOutput('commit', context.sha);
            core.setOutput('formats', formats.join(','));
            await core.summary.addHeading(`CircuitAliveEDA ${label}`)
              .addRaw(`Building ${formats.join(', ')} using package version ${version} from commit ${context.sha}. ` +
                (process.env.PUBLISH_RELEASE === 'true' ? 'A stable release will be published after all selected jobs pass.' : 'Artifacts only; no release or tag will be created.'))
              .write();

  deb:
    name: Ubuntu DEB package
    needs: prepare
    if: contains(needs.prepare.outputs.formats, 'deb')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Free hosted runner disk for the native Ubuntu build
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h .
      - name: Restore Ubuntu compiler cache
        id: compiler-cache
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: .circuitalive/ccache-deb
          key: linux-ubuntu2404-deb-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: linux-ubuntu2404-deb-v1-
      - name: Install Ubuntu build tools and development headers
        run: bash tools/circuitalive/release/build-deb.sh tools
      - name: Identify Ubuntu native dependency ABI
        id: native-profile
        run: |
          python3 qa/tests/cli/test_deb_dependency_cache.py
          echo "value=$(python3 tools/circuitalive/release/deb-dependency-cache.py profile)" >> "$GITHUB_OUTPUT"
      - name: Restore matching Ubuntu native dependencies
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: .circuitalive/deb-deps
          key: ubuntu2404-native-v1-${{ steps.native-profile.outputs.value }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ubuntu2404-native-v1-${{ steps.native-profile.outputs.value }}-
      - name: Verify or compile Ubuntu native dependencies
        id: native-deps
        run: bash tools/circuitalive/release/build-deb.sh dependencies
      - name: Preserve verified native dependencies before the application build
        if: always() && steps.native-deps.outcome == 'success' && steps.native-deps.outputs.cache-reused != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .circuitalive/deb-deps
          key: ubuntu2404-native-v1-${{ steps.native-profile.outputs.value }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Compile and test natively on Ubuntu 24.04, then package and verify DEB
        run: bash tools/circuitalive/release/build-deb.sh build
      - name: Preserve Ubuntu compiler cache after success or failure
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .circuitalive/ccache-deb
          key: linux-ubuntu2404-deb-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Downloadable Ubuntu DEB
        uses: actions/upload-artifact@v7
        with:
          path: dist/CircuitAliveEDA-${{ env.RELEASE_VERSION }}-ubuntu24.04-amd64.deb
          archive: false
          if-no-files-found: error
      - name: Preserve Ubuntu package checksum
        uses: actions/upload-artifact@v7
        with:
          name: CircuitAliveEDA-${{ env.RELEASE_VERSION }}-ubuntu24.04-SHA256
          path: dist/*-ubuntu24.04-amd64.deb.sha256
          if-no-files-found: error
      - name: Preserve Ubuntu diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deb-release-diagnostics
          path: |
            .circuitalive/logs/deb-release.log
            build/deb/CMakeCache.txt
            build/deb/CMakeFiles/CMakeConfigureLog.yaml
            build/deb/Testing/Temporary/
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish verified Ubuntu DEB
    needs: [prepare, deb]
    if: >-
      always() && !cancelled() && inputs.publish_release &&
      needs.prepare.result == 'success' &&
      needs.deb.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_LABEL: ${{ needs.prepare.outputs.release_label }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_FORMATS: ${{ needs.prepare.outputs.formats }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Collect installers and checksums for this version
        uses: actions/download-artifact@v8
        with:
          pattern: CircuitAliveEDA-${{ env.RELEASE_VERSION }}-*
          merge-multiple: true
          path: dist
      - name: Verify formats and checksums, then publish the release
        run: |
          python3 tools/circuitalive/release/publish-release.py \
            --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" \
            --release-label "$RELEASE_LABEL" \
            --formats "$RELEASE_FORMATS" --repository "$GITHUB_REPOSITORY" --directory dist --publish
