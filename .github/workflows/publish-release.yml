name: Release packages (all or individual)
run-name: Packages ${{ inputs.version }} — ${{ inputs.target }}

# Commits, pushes and tags do not start a release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version used in release name, files, About dialog and installer (e.g. 10.0.7-alpha.4.2.0)
        required: true
        default: 10.0.7-alpha.4.2.0
        type: string
      target:
        description: Packages to build (all = RPM + AppImage + DEB + EXE)
        type: choice
        required: true
        default: all
        options:
          - all
          - linux
          - fedora
          - windows
          - exe
          - rpm
          - appimage
          - deb
      publish_release:
        description: Create or add packages to this version on GitHub (uncheck for downloadable build artifacts only)
        type: boolean
        default: true

concurrency:
  group: publish-release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    name: Validate version and release destination
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      release_label: ${{ steps.release.outputs.release_label }}
      formats: ${{ steps.release.outputs.formats }}
      fedora_formats: ${{ steps.release.outputs.fedora_formats }}
    steps:
      - uses: actions/checkout@v7
      - name: Check release publication guard
        run: |
          python3 qa/tests/cli/test_programmable_assets.py
          python3 qa/tests/cli/test_release_artifacts.py
          python3 qa/tests/cli/test_release_versions.py
          python3 qa/tests/cli/test_incremental_release.py
          python3 qa/tests/cli/test_release_workflow.py
      - uses: actions/github-script@v8
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TARGET: ${{ inputs.target }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        with:
          script: |
            if (context.ref !== 'refs/heads/main') {
              throw new Error('Run this release workflow from main.');
            }
            const version = process.env.RELEASE_VERSION.trim();
            const parsed = /^([0-9]+\.[0-9]+\.[0-9]+)-(alpha\.)?([0-9]+(?:\.[0-9]+){0,3})$/.exec(version);
            if (!parsed || parsed[3].split('.').some(part => Number(part) > 65535)) {
              throw new Error('Enter KiCad-CircuitAlive version, e.g. 10.0.7-alpha.4.2.0 (1–4 CircuitAlive numbers, each 0–65535).');
            }
            const label = version;
            const tag = `v${version}`;
            const targets = {all: ['rpm', 'appimage', 'deb', 'exe'],
              linux: ['rpm', 'appimage', 'deb'], fedora: ['rpm', 'appimage'],
              windows: ['exe'], exe: ['exe'],
              rpm: ['rpm'], appimage: ['appimage'], deb: ['deb']};
            const formats = targets[process.env.RELEASE_TARGET];
            if (!formats) throw new Error('Unknown package target.');
            core.setOutput('version', version);
            core.setOutput('release_label', label);
            core.setOutput('tag', tag);
            core.setOutput('commit', context.sha);
            core.setOutput('formats', formats.join(','));
            core.setOutput('fedora_formats', formats.filter(f => ['rpm', 'appimage'].includes(f)).join(','));
            await core.summary.addHeading(`CircuitAliveEDA ${label}`)
              .addRaw(`Building ${formats.join(', ')} using package version ${version} from commit ${context.sha}. ` +
                (process.env.PUBLISH_RELEASE === 'true' ? 'Selected packages will be added to this version after the builds pass; existing platform packages are preserved.' : 'Artifacts only; no release or tag will be created.'))
              .write();

  windows:
    name: Windows installer
    needs: prepare
    if: contains(needs.prepare.outputs.formats, 'exe')
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  linux:
    name: Fedora packages
    needs: prepare
    if: needs.prepare.outputs.fedora_formats != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_FORMATS: ${{ needs.prepare.outputs.fedora_formats }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Free hosted runner disk for builds and component libraries
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h .
      - name: Restore Linux compiler cache
        id: compiler-cache
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: .circuitalive/ccache
          key: linux-fedora44-release-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: linux-fedora44-release-v1-
      - name: Compile, test and package selected formats in Fedora 44
        run: |
          docker run --rm \
            -e RELEASE_VERSION -e RELEASE_COMMIT -e RELEASE_FORMATS -e CIRCUITALIVE_JOBS=2 \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            fedora:44 bash tools/circuitalive/release/build-linux.sh
      - name: Preserve Linux compiler cache after success or failure
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .circuitalive/ccache
          key: linux-fedora44-release-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Downloadable Fedora RPM
        if: contains(needs.prepare.outputs.formats, 'rpm')
        uses: actions/upload-artifact@v7
        with:
          path: dist/CircuitAliveEDA-${{ env.RELEASE_VERSION }}.rpm
          archive: false
          if-no-files-found: error
      - name: Downloadable Linux AppImage
        if: contains(needs.prepare.outputs.formats, 'appimage')
        uses: actions/upload-artifact@v7
        with:
          path: dist/CircuitAliveEDA-${{ env.RELEASE_VERSION }}.AppImage
          archive: false
          if-no-files-found: error
      - name: Preserve Linux package checksums
        uses: actions/upload-artifact@v7
        with:
          name: CircuitAliveEDA-${{ env.RELEASE_VERSION }}-linux-SHA256
          path: |
            dist/*.rpm.sha256
            dist/*.AppImage.sha256
          if-no-files-found: error
      - name: Preserve Linux diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-release-diagnostics
          path: |
            .circuitalive/logs/linux-release.log
            build/circuitalive/CMakeCache.txt
            build/circuitalive/CMakeFiles/CMakeConfigureLog.yaml
            build/circuitalive/Testing/Temporary/
          if-no-files-found: warn
          retention-days: 14

  deb:
    name: Ubuntu DEB package
    needs: prepare
    if: contains(needs.prepare.outputs.formats, 'deb')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Free hosted runner disk for the native Ubuntu build
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h .
      - name: Restore Ubuntu compiler cache
        id: compiler-cache
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: .circuitalive/ccache-deb
          key: linux-ubuntu2404-deb-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: linux-ubuntu2404-deb-v1-
      - name: Install Ubuntu build tools and development headers
        run: bash tools/circuitalive/release/build-deb.sh tools
      - name: Identify Ubuntu native dependency ABI
        id: native-profile
        run: |
          python3 qa/tests/cli/test_deb_dependency_cache.py
          echo "value=$(python3 tools/circuitalive/release/deb-dependency-cache.py profile)" >> "$GITHUB_OUTPUT"
      - name: Restore matching Ubuntu native dependencies
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: .circuitalive/deb-deps
          key: ubuntu2404-native-v1-${{ steps.native-profile.outputs.value }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ubuntu2404-native-v1-${{ steps.native-profile.outputs.value }}-
      - name: Verify or compile Ubuntu native dependencies
        id: native-deps
        run: bash tools/circuitalive/release/build-deb.sh dependencies
      - name: Preserve verified native dependencies before the application build
        if: always() && steps.native-deps.outcome == 'success' && steps.native-deps.outputs.cache-reused != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .circuitalive/deb-deps
          key: ubuntu2404-native-v1-${{ steps.native-profile.outputs.value }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Compile and test natively on Ubuntu 24.04, then package and verify DEB
        run: bash tools/circuitalive/release/build-deb.sh build
      - name: Preserve Ubuntu compiler cache after success or failure
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .circuitalive/ccache-deb
          key: linux-ubuntu2404-deb-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Downloadable Ubuntu DEB
        uses: actions/upload-artifact@v7
        with:
          path: dist/CircuitAliveEDA-${{ env.RELEASE_VERSION }}.deb
          archive: false
          if-no-files-found: error
      - name: Preserve Ubuntu package checksum
        uses: actions/upload-artifact@v7
        with:
          name: CircuitAliveEDA-${{ env.RELEASE_VERSION }}-ubuntu24.04-SHA256
          path: dist/*.deb.sha256
          if-no-files-found: error
      - name: Preserve Ubuntu diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deb-release-diagnostics
          path: |
            .circuitalive/logs/deb-release.log
            build/deb/CMakeCache.txt
            build/deb/CMakeFiles/CMakeConfigureLog.yaml
            build/deb/Testing/Temporary/
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Assemble downloads and optionally complete release
    needs: [prepare, windows, linux, deb]
    # Optional platform jobs are deliberately skipped for individual builds.
    if: >-
      always() && !cancelled() &&
      needs.prepare.result == 'success' &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped') &&
      (needs.linux.result == 'success' || needs.linux.result == 'skipped') &&
      (needs.deb.result == 'success' || needs.deb.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_LABEL: ${{ needs.prepare.outputs.release_label }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_FORMATS: ${{ needs.prepare.outputs.formats }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Collect installers and checksums for this version
        uses: actions/download-artifact@v8
        with:
          pattern: CircuitAliveEDA-${{ env.RELEASE_VERSION }}*
          merge-multiple: true
          path: dist
      - name: Verify selected packages and group auxiliary files
        run: |
          python3 tools/circuitalive/release/publish-release.py \
            --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" \
            --formats "$RELEASE_FORMATS" --directory dist
      - name: Downloadable auxiliary archive
        uses: actions/upload-artifact@v7
        with:
          path: dist/CircuitAliveEDA-${{ env.RELEASE_VERSION }}-auxiliares.zip
          archive: false
          if-no-files-found: error
      - name: Verify formats and checksums, then publish the release
        if: inputs.publish_release
        run: |
          python3 tools/circuitalive/release/release.py "$RELEASE_VERSION" \
            --from-artifacts --formats "$RELEASE_FORMATS" \
            --repository "$GITHUB_REPOSITORY" --directory dist
