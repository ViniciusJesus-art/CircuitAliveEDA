name: Release packages (all or individual)
run-name: Packages ${{ inputs.version }} — ${{ inputs.target }}

# Commits, pushes and tags do not start a release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Public release name (e.g. 10.0.7-alpha.3 or October Preview)
        required: true
        default: 10.0.7-alpha.3
        type: string
      target:
        description: Packages to build (all = RPM + AppImage + DEB + EXE)
        type: choice
        required: true
        default: all
        options:
          - all
          - linux
          - exe
          - rpm
          - appimage
          - deb
      publish_release:
        description: Publish selected packages as a stable GitHub release (uncheck for test artifacts only)
        type: boolean
        default: true

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    name: Validate version and release destination
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      release_label: ${{ steps.release.outputs.release_label }}
      formats: ${{ steps.release.outputs.formats }}
      fedora_formats: ${{ steps.release.outputs.fedora_formats }}
    steps:
      - uses: actions/checkout@v7
      - name: Check release publication guard
        run: |
          python3 qa/tests/cli/test_release_artifacts.py
          python3 qa/tests/cli/test_component_libraries.py
      - uses: actions/github-script@v8
        id: release
        env:
          RELEASE_LABEL: ${{ inputs.version }}
          RELEASE_TARGET: ${{ inputs.target }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        with:
          script: |
            if (context.ref !== 'refs/heads/main') {
              throw new Error('Run this release workflow from main.');
            }
            const label = process.env.RELEASE_LABEL.trim();
            if (!label || label.length > 100 || /[\x00-\x1f\x7f]/.test(label)) {
              throw new Error('Enter a nonempty release name of at most 100 printable characters.');
            }
            const slug = label.normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
              .replace(/[^A-Za-z0-9._-]+/g, '-').replace(/^[._-]+|[._-]+$/g, '')
              .replace(/\.{2,}/g, '.').slice(0, 80).replace(/[._-]+$/g, '');
            if (!slug) throw new Error('Release name needs a letter or number for its filename.');
            const tag = /^v[0-9]/.test(slug) ? slug : `v${slug}`;
            // RPM and Debian metadata require a numeric version. Keep that separate
            // from the unrestricted public release name, and auto-derive one when needed.
            const version = /^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$/.test(label)
              ? label : `10.0.7-alpha.${process.env.GITHUB_RUN_NUMBER}`;
            const targets = {all: ['rpm', 'appimage', 'deb', 'exe'],
              linux: ['rpm', 'appimage', 'deb'], exe: ['exe'],
              rpm: ['rpm'], appimage: ['appimage'], deb: ['deb']};
            const formats = targets[process.env.RELEASE_TARGET];
            if (!formats) throw new Error('Unknown package target.');
            if (process.env.PUBLISH_RELEASE === 'true') for (const lookup of [
              () => github.rest.git.getRef({...context.repo, ref: `tags/${tag}`}),
              () => github.rest.repos.getReleaseByTag({...context.repo, tag})
            ]) {
              try { await lookup(); }
              catch (error) {
                if (error.status === 404) continue;
                throw error;
              }
              throw new Error(`Tag or release ${tag} already exists. Choose an unused version.`);
            }
            core.setOutput('version', version);
            core.setOutput('release_label', label);
            core.setOutput('tag', tag);
            core.setOutput('commit', context.sha);
            core.setOutput('formats', formats.join(','));
            core.setOutput('fedora_formats', formats.filter(f => ['rpm', 'appimage'].includes(f)).join(','));
            await core.summary.addHeading(`CircuitAliveEDA ${label}`)
              .addRaw(`Building ${formats.join(', ')} using package version ${version} from commit ${context.sha}. ` +
                (process.env.PUBLISH_RELEASE === 'true' ? 'A stable release will be published after all selected jobs pass.' : 'Artifacts only; no release or tag will be created.'))
              .write();

  windows:
    name: Windows installer
    needs: prepare
    if: contains(needs.prepare.outputs.formats, 'exe')
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  linux:
    name: Fedora packages
    needs: prepare
    if: needs.prepare.outputs.fedora_formats != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_FORMATS: ${{ needs.prepare.outputs.fedora_formats }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Free hosted runner disk for builds and component libraries
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h .
      - name: Restore Linux compiler cache
        uses: actions/cache@v5
        with:
          path: .circuitalive/ccache
          key: linux-fedora44-release-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: linux-fedora44-release-v1-
      - name: Compile, test and package selected formats in Fedora 44
        run: |
          docker run --rm \
            -e RELEASE_VERSION -e RELEASE_COMMIT -e RELEASE_FORMATS -e CIRCUITALIVE_JOBS=2 \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            fedora:44 bash tools/circuitalive/release/build-linux.sh
      - name: Downloadable Fedora RPM
        if: contains(needs.prepare.outputs.formats, 'rpm')
        uses: actions/upload-artifact@v7
        with:
          path: dist/CircuitAliveEDA-${{ env.RELEASE_VERSION }}-fedora44-x86_64.rpm
          archive: false
          if-no-files-found: error
      - name: Downloadable Linux AppImage
        if: contains(needs.prepare.outputs.formats, 'appimage')
        uses: actions/upload-artifact@v7
        with:
          path: dist/CircuitAliveEDA-${{ env.RELEASE_VERSION }}-linux-x86_64.AppImage
          archive: false
          if-no-files-found: error
      - name: Preserve Linux package checksums
        uses: actions/upload-artifact@v7
        with:
          name: CircuitAliveEDA-${{ env.RELEASE_VERSION }}-linux-SHA256
          path: |
            dist/*-fedora44-x86_64.rpm.sha256
            dist/*-linux-x86_64.AppImage.sha256
          if-no-files-found: error
      - name: Preserve Linux diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-release-diagnostics
          path: |
            .circuitalive/logs/linux-release.log
            build/circuitalive/CMakeCache.txt
            build/circuitalive/CMakeFiles/CMakeConfigureLog.yaml
            build/circuitalive/Testing/Temporary/
          if-no-files-found: warn
          retention-days: 14

  deb:
    name: Ubuntu DEB package
    needs: prepare
    if: contains(needs.prepare.outputs.formats, 'deb')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Free hosted runner disk for the native Ubuntu build
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h .
      - name: Restore Ubuntu compiler cache
        uses: actions/cache@v5
        with:
          path: .circuitalive/ccache-deb
          key: linux-ubuntu2404-deb-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: linux-ubuntu2404-deb-v1-
      - name: Compile and test natively on Ubuntu 24.04, then package and verify DEB
        run: bash tools/circuitalive/release/build-deb.sh
      - name: Downloadable Ubuntu DEB
        uses: actions/upload-artifact@v7
        with:
          path: dist/CircuitAliveEDA-${{ env.RELEASE_VERSION }}-ubuntu24.04-amd64.deb
          archive: false
          if-no-files-found: error
      - name: Preserve Ubuntu package checksum
        uses: actions/upload-artifact@v7
        with:
          name: CircuitAliveEDA-${{ env.RELEASE_VERSION }}-ubuntu24.04-SHA256
          path: dist/*-ubuntu24.04-amd64.deb.sha256
          if-no-files-found: error
      - name: Preserve Ubuntu diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deb-release-diagnostics
          path: |
            .circuitalive/logs/deb-release.log
            build/deb/CMakeCache.txt
            build/deb/CMakeFiles/CMakeConfigureLog.yaml
            build/deb/Testing/Temporary/
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish selected verified packages together
    needs: [prepare, windows, linux, deb]
    # Optional platform jobs are deliberately skipped for individual builds.
    if: >-
      always() && !cancelled() && inputs.publish_release &&
      needs.prepare.result == 'success' &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped') &&
      (needs.linux.result == 'success' || needs.linux.result == 'skipped') &&
      (needs.deb.result == 'success' || needs.deb.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_LABEL: ${{ needs.prepare.outputs.release_label }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_FORMATS: ${{ needs.prepare.outputs.formats }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Collect installers and checksums for this version
        uses: actions/download-artifact@v8
        with:
          pattern: CircuitAliveEDA-${{ env.RELEASE_VERSION }}-*
          merge-multiple: true
          path: dist
      - name: Verify formats and checksums, then publish the release
        run: |
          python3 tools/circuitalive/release/publish-release.py \
            --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" \
            --release-label "$RELEASE_LABEL" \
            --formats "$RELEASE_FORMATS" --repository "$GITHUB_REPOSITORY" --directory dist --publish
